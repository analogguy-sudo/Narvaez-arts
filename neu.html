<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eva Narváez</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--side:#191919;--gold:#c1a377;--goldtext:#8b6a30;--cream:#f6f1dd;--page:#efeadf;--ink:#2b2a26;--muted:#5b574d;
 --font:"Oswald","Arial Narrow",Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font:300 18px/1.6 var(--font);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background-color:#ebe6da;background-image:radial-gradient(ellipse at 25% 15%,rgba(255,255,255,.45),transparent 65%),repeating-linear-gradient(0deg,rgba(120,105,80,.04) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(120,105,80,.04) 0 1px,transparent 1px 3px),url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27300%27%20height%3D%27300%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.8%27%20numOctaves%3D%273%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%20.45%200%200%200%200%20.4%200%200%200%200%20.3%200%200%200%20.1%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%2F%3E%3C%2Fsvg%3E");background-attachment:fixed}
.wrap{flex:1;width:100%;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:300px 1fr;gap:28px;padding:28px}
aside{background:var(--side);color:var(--gold);padding:32px 20px 26px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:124px;height:auto;display:block}
.name{margin:16px 0 0;font-size:22px;line-height:1.3;text-transform:uppercase;font-weight:300}
.name span{white-space:pre-line}
.rule{width:165px;height:1px;background:var(--gold);margin:26px 0 38px;position:relative}
.rule::before{content:"";position:absolute;left:50%;top:-4px;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:var(--gold)}
.rule::after{content:"";position:absolute;left:50%;top:0;width:1px;height:22px;background:var(--gold)}
nav{display:flex;flex-direction:column;gap:20px}
nav a{color:var(--gold);text-decoration:none;text-transform:uppercase;font-size:20px;border-bottom:1px solid transparent;padding-bottom:2px;align-self:center}
nav a:hover,nav a[aria-current="page"]{border-color:var(--gold)}
.navbtn{background:none;border:0;border-bottom:1px solid transparent;font:inherit;font-size:20px;text-transform:uppercase;color:var(--gold);padding:0 0 2px;cursor:pointer;align-self:center}
.navbtn:hover,.navbtn[aria-current="page"]{border-color:var(--gold)}
.sub{display:flex;flex-direction:column;gap:12px;margin-top:-6px}
.sub a{font-size:16px}
.langs{display:flex;gap:12px;justify-content:center;margin-top:30px}
.langs button{background:none;border:0;border-bottom:1px solid transparent;color:var(--gold);font:inherit;font-size:16px;cursor:pointer;padding:2px 4px}
.langs button[aria-pressed="true"]{border-color:var(--gold)}
.contact{margin-top:auto;padding-top:40px;font-size:15px;line-height:1.9}
.contact a{color:var(--gold);text-decoration:none}
main{background:rgba(249,245,232,.9);box-shadow:0 2px 14px rgba(80,65,40,.07);padding:34px 36px 40px;display:flex;flex-direction:column;align-items:center}
.view{width:100%;display:flex;flex-direction:column;align-items:center}
h1{margin:0 0 26px;font-size:clamp(26px,3.6vw,44px);font-weight:300;text-transform:uppercase;color:var(--goldtext);text-align:center;line-height:1.15}
.portrait{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:center 18%;display:block;flex:none}
#home{flex:1}
.me{display:flex;align-items:center;gap:18px;margin-top:auto;padding-top:48px;color:inherit;text-decoration:none;text-align:left}
.me b{display:block;font-weight:400;font-size:22px;text-transform:uppercase;line-height:1.2}
.me small{display:block;color:var(--muted);font-size:16px}
.me:hover b{color:var(--goldtext)}
.cap{margin-top:22px;font-size:24px;text-transform:uppercase;font-weight:400;text-align:center}
.intro{margin:2px 0 0;color:var(--muted);font-size:17px;text-align:center}
.text{max-width:640px;width:100%;font-size:17px;line-height:1.75}
.text p{margin:0 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:26px 20px;width:100%}
.tiles .note{grid-column:1/-1;text-align:center}
.note{color:var(--muted);font-size:16px}
.tile h3{margin:10px 0 2px;font-size:19px;font-weight:400}
.tile p{margin:2px 0;font-size:14px;color:var(--muted);line-height:1.5}
.tile .price{color:var(--ink)}
.ask{display:inline-block;margin-top:6px;font-size:13px;color:var(--goldtext);text-transform:uppercase;border-bottom:1px solid var(--goldtext);text-decoration:none}
.zoom{display:block;width:100%;padding:0;border:0;background:#e8e1d7;cursor:zoom-in;position:relative}
.zoom img{width:100%;aspect-ratio:4/5;object-fit:contain;display:block}
.more{position:absolute;right:8px;bottom:8px;background:rgba(25,25,25,.85);color:var(--gold);font-size:12px;padding:3px 8px}
.mail{display:inline-block;margin-top:10px;padding:10px 22px;background:var(--side);color:var(--gold);text-decoration:none;text-transform:uppercase;font-size:16px}
footer{background:var(--side);color:var(--gold);font-size:14px;text-align:center;padding:14px 20px;overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--goldtext);outline-offset:3px}
aside :focus-visible,footer :focus-visible{outline-color:var(--gold)}
dialog{border:0;padding:0;background:transparent;width:100%;height:100%;max-width:100vw;max-height:100vh}
dialog::backdrop{background:rgba(15,15,15,.95)}
.lb-in{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:56px 56px 20px}
#lbImg{max-width:100%;max-height:calc(100vh - 170px);object-fit:contain}
#lbCap{color:#eee;font-size:15px}
#lbThumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#lbThumbs img{width:54px;height:54px;object-fit:cover;opacity:.55;cursor:pointer}
#lbThumbs img.on{opacity:1;outline:2px solid #fff}
.lb-x,.lb-n{position:absolute;background:none;border:0;color:#fff;font-size:42px;line-height:1;cursor:pointer;padding:8px 14px}
.lb-x{top:8px;right:10px}.lb-n{top:50%;transform:translateY(-50%)}.lb-p{left:4px}.lb-nx{right:4px}
@media(max-width:820px){
 body{background-attachment:scroll}
 .wrap{grid-template-columns:1fr;padding:12px;gap:12px}
 aside{padding:22px 16px}
 .rule{margin:18px 0 16px}
 nav{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:10px 18px}
 nav a,.navbtn{font-size:17px}
 .sub{flex-basis:100%;flex-direction:row;justify-content:center;gap:10px 18px;margin-top:0}
 .langs{margin-top:18px}
 .contact{display:none}
 main{padding:26px 18px 30px}
 .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
 .lb-in{padding:52px 8px 16px}.lb-n{top:auto;bottom:70px;transform:none}
}
@media(max-width:420px){.tiles{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <svg class="logo" viewBox="30 20 640 590" role="img" aria-label="Monogramm EN" xmlns="http://www.w3.org/2000/svg"><g fill="#c1a377"><path d="M477.4 114.6A244 244 0 1 0 477.4 509.4" fill="none" stroke="#c1a377" stroke-width="75"/><rect x="122" y="280" width="123" height="65"/><rect x="277" y="135" width="58" height="355"/><rect x="583" y="35" width="62" height="555"/><polygon points="335,135 347,135 583,470 583,590 572,590 335,252"/></g></svg>
    <p class="name">Eva Narváez |<br><span data-t="sub"></span></p>
    <div class="rule"></div>
    <nav aria-label="Menu">
      <a href="#home" data-v="home" data-t="nHome"></a>
      <button type="button" class="navbtn" id="navPortfolio" data-t="nPortfolio" aria-expanded="false" aria-controls="subnav"></button>
      <div class="sub" id="subnav" hidden>
        <a href="#kunst" data-v="kunst" data-t="fKunst"></a>
        <a href="#cartoon" data-v="cartoon" data-t="fCartoon"></a>
      </div>
      <a href="#ueber" data-v="ueber" data-t="nUeber"></a>
      <a href="#auftraege" data-v="auftraege" data-t="nAuftraege"></a>
      <a href="#kontakt" data-v="kontakt" data-t="nKontakt"></a>
    </nav>
    <div class="langs" role="group" aria-label="Sprache / Idioma / Language">
      <button type="button" data-l="de">DE</button><button type="button" data-l="es">ES</button><button type="button" data-l="en">EN</button>
    </div>
    <div class="contact" id="sideContact"></div>
  </aside>

  <main>
    <section class="view" id="home">
      <h1 data-t="homeTitle"></h1>
      <a class="me" href="#ueber">
        <img class="portrait" id="portrait" alt="Eva Narváez" hidden>
        <span><b>Eva Narváez</b><small data-t="homeIntro"></small></span>
      </a>
    </section>
    <section class="view" id="portfolio" hidden>
      <h1 id="hPort"></h1>
      <div class="tiles" id="gAll"></div>
    </section>
    <section class="view" id="ueber" hidden>
      <h1 data-t="hUeber"></h1>
      <div class="text" id="aboutText"></div>
    </section>
    <section class="view" id="auftraege" hidden>
      <h1 data-t="hAuftraege"></h1>
      <div class="text"><p data-t="orders"></p></div>
    </section>
    <section class="view" id="kontakt" hidden>
      <h1 data-t="hKontakt"></h1>
      <div class="text" style="text-align:center">
        <p data-t="contactText"></p>
        <a class="mail" id="mailBtn" href="#"></a>
        <p style="margin-top:18px" id="contactLines"></p>
      </div>
    </section>
  </main>
</div>
<footer id="foot"></footer>

<dialog id="lb" aria-label="Bildansicht">
  <div class="lb-in">
    <button class="lb-x" id="lbX" type="button" aria-label="Close">×</button>
    <button class="lb-n lb-p" id="lbPrev" type="button" aria-label="Previous">‹</button>
    <img id="lbImg" alt="">
    <button class="lb-n lb-nx" id="lbNext" type="button" aria-label="Next">›</button>
    <div id="lbCap"></div>
    <div id="lbThumbs"></div>
  </div>
</dialog>

<script>
const SB_URL="https://vavevulydesvapopwqgd.supabase.co";
const SB_KEY="sb_publishable_pqNBiPM-4zQk_-Ile4fnQw_BXvrW0dN";
/* Kontaktdaten – bitte prüfen */
const CFG={email:"hello@evanarvaez.art",insta:"@evanarvaez.art",web:"www.evanarvaez.art",city:"Hamburg, Deutschland"};

const L={
de:{pageTitle:"Eva Narváez – Bildende Kunst & Illustration",sub:"Bildende Künstlerin\n& Illustratorin",
 nHome:"Home",nKunst:"Bildende Kunst",nCartoon:"Cartoon & Illustration",nUeber:"Über mich",nAuftraege:"Aufträge",nKontakt:"Kontakt",
 nPortfolio:"Portfolio",hPortfolio:"Portfolio",fAll:"Alle",fKunst:"Bildende Kunst",fCartoon:"Cartoon & Illustration",prev:"Zurück",next:"Weiter",homeTitle:"Farbe, Emotion und persönliche Erfahrung",homeIntro:"Bildende Kunst, Cartoon und Illustration.",
 hKunst:"Bildende Kunst",hCartoon:"Cartoon & Illustration",hUeber:"Über mich",hAuftraege:"Aufträge",hKontakt:"Kontakt",

 loading:"Werke werden geladen …",empty:"Hier sind noch keine Werke.",error:"Die Werke konnten nicht geladen werden",
 sold:"Verkauft",enquire:"Werk anfragen",subject:"Anfrage zu",fContact:"Kontakt",
 about:["Ich heiße Eva Narváez und komme aus Cádiz, Spanien. Ich habe Bildende Kunst an der Universität Alonso Cano in Granada studiert, wo ich meine künstlerischen Fähigkeiten weiterentwickelt und meinen eigenen Stil gefunden habe.",

es:{pageTitle:"Eva Narváez – Bellas Artes e ilustración",sub:"Artista plástica\ne ilustradora",
 nHome:"Inicio",nKunst:"Bellas Artes",nCartoon:"Cartoon e ilustración",nUeber:"Sobre mí",nAuftraege:"Encargos",nKontakt:"Contacto",
 nPortfolio:"Portfolio",hPortfolio:"Portfolio",fAll:"Todas",fKunst:"Bellas Artes",fCartoon:"Cartoon e ilustración",prev:"Anterior",next:"Siguiente",homeTitle:"Color, emoción y experiencia personal",homeIntro:"Bellas Artes, cartoon e ilustración.",
 hKunst:"Bellas Artes",hCartoon:"Cartoon e ilustración",hUeber:"Sobre mí",hAuftraege:"Encargos",hKontakt:"Contacto",
 orders:"[Texto pendiente] Aquí describo qué trabajos por encargo ofrezco y cómo funciona una consulta.",
 contactText:"Las consultas sobre exposiciones, compras y encargos son bienvenidas.",
 loading:"Cargando obras …",empty:"Todavía no hay obras aquí.",error:"No se pudieron cargar las obras",
 sold:"Vendida",enquire:"Consultar obra",subject:"Consulta sobre",fContact:"Contacto",
 about:["Me llamo Eva Narváez y soy de Cádiz, España. Estudié Bellas Artes en la Universidad Alonso Cano de Granada, donde desarrollé mis habilidades artísticas y encontré mi propio estilo.",

 "Con mi arte quiero expresar colores, emociones y experiencias personales, e invitar a quienes lo contemplan a descubrir el mundo desde mi perspectiva muy personal."]},

 nHome:"Home",nKunst:"Fine Art",nCartoon:"Cartoon & Illustration",nUeber:"About me",nAuftraege:"Commissions",nKontakt:"Contact",
 nPortfolio:"Portfolio",hPortfolio:"Portfolio",fAll:"All",fKunst:"Fine Art",fCartoon:"Cartoon & Illustration",prev:"Previous",next:"Next",homeTitle:"Colour, emotion and personal experience",homeIntro:"Fine art, cartoon and illustration.",

 orders:"[Placeholder] Here I describe which commissions I offer and how an enquiry works.",
 contactText:"Enquiries about exhibitions, acquisitions and commissions are welcome.",

 about:["My name is Eva Narváez and I come from Cádiz, Spain. I studied Fine Arts at the Universidad Alonso Cano in Granada, where I developed my artistic skills and found my own style.",
 "I then spent a year in Dublin, where I focused on sketching and was able to gather new inspiration and impressions.",
 "I have already had the chance to present my work at two exhibition openings in Chiclana de la Frontera: “Color y Vida” and “Perfectamente Imperfecta”. Both exhibitions were a special opportunity for me to share my creativity and my passion for art with other people.",
 "With my art, I want to express colour, emotion and personal experience, and invite viewers to discover the world from my very own perspective."]}
};

const $=id=>document.getElementById(id);
let lang="de",arts=[],state="loading",err="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const imgURL=p=>SB_URL+"/storage/v1/object/public/artworks/"+encodeURI(p);
const money=v=>new Intl.NumberFormat({de:"de-DE",es:"es-ES",en:"en-GB"}[lang],{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(v);

function card(a,i,t){
  const ti=a["title_"+lang]||a.title_de||"",de=a["description_"+lang]||a.description_de||"",n=(a.detail_paths||[]).length;
  return '<article class="tile"><button type="button" class="zoom" data-i="'+i+'" aria-label="'+esc(ti)+'"><img src="'+esc(imgURL(a.image_path))+'" alt="'+esc(ti)+'" loading="lazy">'+(n?'<span class="more">+'+n+'</span>':"")+'</button>'+
   '<h3>'+esc(ti)+'</h3>'+(de?'<p>'+esc(de)+'</p>':"")+(a.price>0?'<p class="price">'+money(a.price)+'</p>':"")+
   (a.available===false?'<p>'+t.sold+'</p>':'<a class="ask" href="mailto:'+CFG.email+'?subject='+encodeURIComponent(t.subject+": "+ti)+'">'+t.enquire+'</a>')+'</article>';
}
let flt="kunst";
function renderGallery(){
  const t=L[lang],box=$("gAll");
  $("hPort").textContent=t[flt==="cartoon"?"fCartoon":"fKunst"];
  const list=arts.map((a,i)=>[a,i]).filter(([a])=>(a.category||"kunst")===flt);
  box.innerHTML=state!=="ok"?'<p class="note">'+(state==="loading"?t.loading:t.error+" ("+esc(err)+")")+'</p>'
    :list.length?list.map(([a,i])=>card(a,i,t)).join(""):'<p class="note">'+t.empty+'</p>';
}

function setLang(l){
  if(!L[l])return;
  lang=l;const t=L[l];
  document.documentElement.lang=l;document.title=t.pageTitle;
  document.querySelectorAll("[data-t]").forEach(e=>{e.textContent=t[e.dataset.t]});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  $("aboutText").innerHTML=t.about.map(p=>"<p>"+esc(p)+"</p>").join("");
  $("sideContact").innerHTML="Instagram: "+esc(CFG.insta)+"<br>Email: <a href=\"mailto:"+CFG.email+"\">"+esc(CFG.email)+"</a><br>Web: "+esc(CFG.web)+"<br>"+esc(CFG.city);
  $("foot").textContent=t.fContact+": Eva Narváez | Web: "+CFG.web+" | Email: "+CFG.email+" | Instagram: "+CFG.insta+" | "+CFG.city;
  $("mailBtn").href="mailto:"+CFG.email;$("mailBtn").textContent=CFG.email;
  $("contactLines").innerHTML="Instagram: "+esc(CFG.insta)+"<br>"+esc(CFG.city);
  try{localStorage.setItem("lang",l)}catch(e){}
  renderGallery();
}

const views=[...document.querySelectorAll(".view")],links=[...document.querySelectorAll("nav a")];
let subOpen=false;
function applySub(){$("subnav").hidden=!subOpen;$("navPortfolio").setAttribute("aria-expanded",subOpen)}
function go(id){
  if(id==="kunst"||id==="cartoon"){flt=id;renderGallery();id="portfolio"}
  if(!$(id)||!views.some(v=>v.id===id))id="home";
  const inP=id==="portfolio";
  subOpen=inP;applySub();
  $("navPortfolio").setAttribute("aria-current",inP?"page":"false");
  links.forEach(a=>{const v=a.dataset.v;a.setAttribute("aria-current",((v==="kunst"||v==="cartoon")?inP&&flt===v:v===id)?"page":"false")});
  views.forEach(v=>{v.hidden=v.id!==id});
  window.scrollTo(0,0);
}
$("navPortfolio").addEventListener("click",()=>{
  if(subOpen){
    subOpen=false;applySub();
    if(!$("portfolio").hidden)location.hash="#home";
  }else{subOpen=true;applySub()}
});
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));

/* Vergrößerung mit Detailfotos */
const lb={a:null,i:0};
const photos=a=>[a.image_path].concat(a.detail_paths||[]);
function showLB(){
  const a=lb.a,ph=photos(a),ti=a["title_"+lang]||a.title_de||"";
  $("lbImg").src=imgURL(ph[lb.i]);$("lbImg").alt=ti;
  $("lbCap").textContent=ti+(ph.length>1?"  ·  "+(lb.i+1)+" / "+ph.length:"");
  $("lbPrev").hidden=$("lbNext").hidden=ph.length<2;
  $("lbThumbs").innerHTML=ph.length>1?ph.map((p,k)=>'<img src="'+esc(imgURL(p))+'" data-k="'+k+'" class="'+(k===lb.i?"on":"")+'" alt="" loading="lazy">').join(""):"";
}
function step(d){const n=photos(lb.a).length;lb.i=(lb.i+d+n)%n;showLB()}
document.querySelector("main").addEventListener("click",e=>{const b=e.target.closest(".zoom");if(!b)return;lb.a=arts[+b.dataset.i];lb.i=0;showLB();$("lb").showModal()});
$("lbX").onclick=()=>$("lb").close();
$("lbPrev").onclick=()=>step(-1);$("lbNext").onclick=()=>step(1);
$("lbThumbs").addEventListener("click",e=>{const k=e.target.dataset.k;if(k!==undefined){lb.i=+k;showLB()}});
$("lb").addEventListener("click",e=>{if(e.target.id==="lb"||e.target.classList.contains("lb-in"))$("lb").close()});
$("lb").addEventListener("keydown",e=>{if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)});

document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
const pt=$("portrait");pt.onload=()=>{pt.hidden=false};pt.src=imgURL("portrait.jpg");

async function load(){
  try{
    const r=await fetch(SB_URL+"/rest/v1/artworks?select=*&published=eq.true&order=sort.asc,created_at.desc",{headers:{apikey:SB_KEY}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    arts=await r.json();state="ok";
