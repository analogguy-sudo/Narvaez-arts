<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf8f3">
<title>Seite nicht gefunden – Eva Narváez</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* Oswald (SIL Open Font License), lokal wie auf der Hauptseite */
@font-face{font-family:"Oswald";font-style:normal;font-weight:300 400;font-display:swap;src:url(/fonts/oswald-latin.woff2) format("woff2")}
:root{--bg:#faf8f3;--ink:#2b2a26;--muted:#6a655a;--gold:#8b6a30}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Oswald",Arial,sans-serif;font-weight:300;text-align:center;padding:24px}
main{max-width:520px}
.mono{width:64px;height:64px;margin:0 auto 18px;display:block}
h1{font-weight:300;font-size:2.4rem;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px}
.no{font-size:.9rem;letter-spacing:.3em;color:var(--gold);margin:0 0 22px}
p{font-size:1.1rem;line-height:1.6;margin:0 0 8px}
p.alt{color:var(--muted);font-size:.98rem}
a.btn{display:inline-block;margin-top:22px;padding:12px 22px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;letter-spacing:.14em;text-transform:uppercase;font-size:.9rem}
a.btn:hover,a.btn:focus-visible{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>
<main>
  <img class="mono" src="/favicon.svg" alt="" width="64" height="64">
  <p class="no">404</p>
  <h1>Eva Narváez</h1>
  <p>Diese Seite gibt es leider nicht.</p>
  <p class="alt" lang="es">Esta página no existe.</p>
  <p class="alt" lang="en">This page does not exist.</p>
  <a class="btn" href="/">Zur Startseite · Inicio · Home</a>
</main>
</body>
</html>
