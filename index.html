 ["h", "3. Alojamiento en GitHub Pages"],
 ["p", "El sitio web se ofrece a través de GitHub Pages, un servicio de GitHub Inc. (EE. UU.). Al visitarlo, su navegador transmite por razones técnicas datos a los servidores de GitHub, en particular su dirección IP, la fecha y la hora, la página visitada, el navegador y el sistema operativo y, en su caso, la página visitada anteriormente. GitHub guarda estos datos en registros del servidor para entregar el sitio web de forma segura y fiable."],

 ["p", "The legal basis is Art. 6(1)(f) GDPR; my legitimate interest lies in providing the website securely and reliably. GitHub is certified under the EU-US Data Privacy Framework, so transfers to the USA are covered by an adequacy decision of the European Commission (Art. 45 GDPR). More information: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement"],

const $=id=>document.getElementById(id);
let lang="de",arts=[],state="loading",err="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const imgURL=p=>SB_URL+"/storage/v1/object/public/artworks/"+encodeURI(p);

/* Werkangaben: Technik · Format · Jahr (leere Felder entfallen) */
const meta=a=>[a["technique_"+lang]||a.technique_de,a.size,a.year].filter(Boolean).join(" · ");
function card(a,i){
  const ti=a["title_"+lang]||a.title_de||"",n=(a.detail_paths||[]).length;
  return '<article class="tile"><button type="button" class="zoom" data-i="'+i+'" aria-label="'+esc(ti)+'"><img src="'+esc(imgURL(a.image_path))+'" alt="'+esc(ti)+'" loading="lazy">'+(n?'<span class="more">+'+n+'</span>':"")+'</button>'+
   '<h3>'+esc(ti)+'</h3>'+(meta(a)?'<p class="meta">'+esc(meta(a))+'</p>':"")+'</article>';
}
function renderFav(){
  const box=$("fav");let i=arts.findIndex(a=>a.featured===true);
  if(i<0)i=arts.findIndex(a=>(a.category||"kunst")==="kunst");
  if(state!=="ok"||i<0){box.hidden=true;box.innerHTML="";return}
  const a=arts[i],ti=a["title_"+lang]||a.title_de||"";
  box.hidden=false;
  box.innerHTML='<button type="button" class="zoom" data-i="'+i+'" aria-label="'+esc(ti)+'"><img src="'+esc(imgURL(a.image_path))+'" alt="'+esc(ti)+'"></button><p class="favcap">'+esc(ti)+'</p>';
}
function renderGallery(){
  renderFav();
  const t=L[lang];
  [["kunst","gKunst"],["cartoon","gCartoon"]].forEach(([c,id])=>{
    const list=arts.map((a,i)=>[a,i]).filter(([a])=>(a.category||"kunst")===c);
    $(id).innerHTML=state!=="ok"?'<p class="note">'+(state==="loading"?t.loading:t.error+" ("+esc(err)+")")+'</p>'
      :list.length?list.map(([a,i])=>card(a,i)).join(""):'<p class="note">'+t.empty+'</p>';
  });
}

function setLang(l){
  if(!L[l])return;
  lang=l;const t=L[l];
  document.documentElement.lang=l;document.title=t.pageTitle;
  document.querySelectorAll("[data-t]").forEach(e=>{e.textContent=t[e.dataset.t]});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  $("aboutText").innerHTML=t.about.map(p=>"<p>"+esc(p)+"</p>").join("");
  const ig=CFG.insta.map(a=>'<a class="igl" href="https://instagram.com/'+a.handle.replace(/^@/,"")+'" target="_blank" rel="noopener" aria-label="Instagram '+esc(a.handle)+'">'+IG+"<span>"+esc(a.handle)+"</span></a> ("+esc(t[a.key])+")");
  const igHtml=ig.join("<br>");
  const mailA='<a class="igl" href="mailto:'+CFG.email+'" aria-label="Email '+esc(CFG.email)+'">'+MAIL+"<span>"+esc(CFG.email)+"</span></a>";
  $("sideContact").innerHTML=igHtml+"<br>"+mailA;
  $("foot").innerHTML=esc(t.fContact)+": Eva Narváez | "+mailA+" | "+ig.join(" · ")+" | "+esc(CFG.city)+' | <a href="#rechtliches">'+esc(t.nImp)+'</a> · <a href="#datenschutz">'+esc(t.nPriv)+'</a> | <span id="copy">© '+new Date().getFullYear()+" Eva Narváez</span>";
  const legal=arr=>arr.map(([k,x])=>k==="h"?"<h2>"+esc(x)+"</h2>":"<p>"+esc(x).replace("{mail}",'<a href="mailto:'+CFG.email+'">'+CFG.email+"</a>").replace(/\n/g,"<br>").replace(/https:\/\/[^\s<]+/g,u=>'<a href="'+u+'" target="_blank" rel="noopener">'+u+"</a>")+"</p>").join("");
  $("privText").innerHTML=legal(PRIV[l]);
  $("impText").innerHTML=legal(IMP[l]);
  $("mailBtn").href="mailto:"+CFG.email;$("mailBtn").innerHTML=MAIL+esc(CFG.email);
  $("contactLines").innerHTML=igHtml;
  try{localStorage.setItem("lang",l)}catch(e){}
  renderGallery();
}

const views=[...document.querySelectorAll(".view")],links=[...document.querySelectorAll("nav a")];
function go(id){
  if(!$(id)||!views.some(v=>v.id===id))id="home";
  views.forEach(v=>{v.hidden=v.id!==id});
  links.forEach(a=>a.setAttribute("aria-current",a.dataset.v===id?"page":"false"));
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));
/* Versteckter Zugang: Doppelklick auf © im Footer öffnet den Adminbereich */
$("foot").addEventListener("dblclick",e=>{if(e.target.id==="copy")location.href="admin.html"});

/* Vergrößerung mit Detailfotos */
const lb={a:null,i:0};
const photos=a=>[a.image_path].concat(a.detail_paths||[]);
function showLB(){
  const a=lb.a,ph=photos(a),ti=a["title_"+lang]||a.title_de||"";
  $("lbImg").src=imgURL(ph[lb.i]);$("lbImg").alt=ti;
  $("lbCap").textContent=ti+(ph.length>1?"  ·  "+(lb.i+1)+" / "+ph.length:"");
  $("lbMeta").textContent=meta(a);$("lbMeta").hidden=!meta(a);
  const de=a["description_"+lang]||a.description_de||"";$("lbDesc").textContent=de;$("lbDesc").hidden=!de;
  $("lbPrev").hidden=$("lbNext").hidden=ph.length<2;
  $("lbThumbs").innerHTML=ph.length>1?ph.map((p,k)=>'<img src="'+esc(imgURL(p))+'" data-k="'+k+'" class="'+(k===lb.i?"on":"")+'" alt="" loading="lazy">').join(""):"";
}
function step(d){const n=photos(lb.a).length;lb.i=(lb.i+d+n)%n;showLB()}
document.querySelector("main").addEventListener("click",e=>{const b=e.target.closest(".zoom");if(!b)return;lb.a=arts[+b.dataset.i];lb.i=0;showLB();$("lb").showModal()});
$("lbX").onclick=()=>$("lb").close();
$("lbPrev").onclick=()=>step(-1);$("lbNext").onclick=()=>step(1);
$("lbThumbs").addEventListener("click",e=>{const k=e.target.dataset.k;if(k!==undefined){lb.i=+k;showLB()}});
$("lb").addEventListener("click",e=>{if(e.target.id==="lb"||e.target.classList.contains("lb-in"))$("lb").close()});
$("lb").addEventListener("keydown",e=>{if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)});

document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
const pt=$("portrait");pt.onload=()=>{pt.hidden=false};pt.src=imgURL("portrait.jpg");

async function load(){
  try{
    const r=await fetch(SB_URL+"/rest/v1/artworks?select=*&published=eq.true&order=sort.asc,created_at.desc",{headers:{apikey:SB_KEY}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    arts=await r.json();state="ok";
  }catch(e){state="error";err=e.message||String(e);console.warn("Supabase",e)}
  renderGallery();
}

let l0=null;try{l0=localStorage.getItem("lang")}catch(e){}
if(!L[l0]){const n=(navigator.language||"de").slice(0,2);l0=L[n]?n:"de"}
setLang(l0);
go(location.hash.slice(1));
load();
</script>
</body>
</html>
