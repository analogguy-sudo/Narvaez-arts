<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f6f1">
<title>Eva Narváez – Bildende Kunst</title>
<style>
:root{--bg:#f8f6f1;--ink:#282720;--muted:#77756d;--accent:#96644e;--line:#e4e0d7}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
a{color:inherit;text-decoration:none}
header,footer{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:22px 6%;border-bottom:1px solid var(--line)}
.logo{font:25px Georgia,serif;letter-spacing:3px}
nav{display:flex;gap:20px;align-items:center}
select{padding:9px;background:transparent;border:1px solid var(--line);color:inherit;font:inherit}
.hero{padding:70px 8%;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:45px}
.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:2px;font-size:11px}
h1,h2,h3{font-family:Georgia,serif;font-weight:normal}
h1{font-size:clamp(42px,6vw,72px);line-height:1.08}
h2{font-size:clamp(32px,4vw,46px)}
.hero p,.about p{line-height:1.9;color:var(--muted)}
.hero-art{width:100%;max-width:340px;aspect-ratio:4/5;justify-self:center;background:#e8e1d7;overflow:hidden}
.hero-art img{width:100%;height:100%;object-fit:cover;object-position:center 12%;display:block}
.button{display:inline-block;background:var(--ink);color:#fff;padding:14px 20px;margin-top:16px;border:0;cursor:pointer;font-size:12px;letter-spacing:1px}
.button:hover{background:var(--accent)}
.gallery{padding:55px 6% 85px;border-top:1px solid var(--line)}
.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px}
.art-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 22px}
.art-card img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#e8e1d7;display:block}
.art-card h3{font-size:21px;margin:14px 0 8px}
.description,.status{color:var(--muted);font-size:13px;line-height:1.6}
.price{margin-top:12px}
.status{display:block;margin-top:7px;color:var(--accent)}
.about{background:#eeebe3;padding:65px 8%}
.about .head{text-align:center}
.about p{max-width:680px;margin:15px auto}
.about .center{text-align:center}
footer{border-top:1px solid var(--line);border-bottom:0;color:var(--muted);font-size:12px}
#message{color:var(--muted);padding:20px 0;line-height:1.7;overflow-wrap:anywhere}
#message.error{color:#a33b2b}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:700px){
  header{padding:18px 5%}nav{gap:10px;font-size:13px}
  .hero{grid-template-columns:1fr;padding:40px 6%}.hero-art{max-width:280px}
  .gallery{padding:40px 5%}
  .art-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}
  .heading{align-items:start;flex-direction:column}
}
@media(max-width:420px){.logo{font-size:18px}.art-grid{grid-template-columns:1fr}footer{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header>
  <a class="logo" href="#">EVA NARVÁEZ</a>
  <nav>
    <a href="#gallery" data-t="navGallery">Galerie</a>
    <a href="#about" data-t="navAbout">Über mich</a>
    <select id="language" aria-label="Sprache / Idioma / Language">
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="en">English</option>
    </select>
  </nav>
</header>

<main>
  <section class="hero">
    <div>
      <span class="eyebrow" data-t="eyebrow"></span>
      <h1 data-t="heroTitle"></h1>
      <p data-t="heroText"></p>
      <a class="button" href="#gallery" data-t="heroButton"></a>
    </div>
    <div class="hero-art"><img id="heroImg" hidden alt=""></div>
  </section>

  <section class="gallery" id="gallery">
    <div class="heading">
      <div>
        <span class="eyebrow" data-t="collection"></span>
        <h2 data-t="galleryTitle"></h2>
      </div>
      <span data-t="gallerySubtitle"></span>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
    <div class="art-grid" id="artGrid"></div>
  </section>

  <section class="about" id="about">
    <div class="head">
      <span class="eyebrow" data-t="aboutEyebrow"></span>
      <h2 data-t="aboutTitle"></h2>
    </div>
    <div id="aboutText"></div>
    <div class="center"><a class="button contact-link" href="#" data-t="contactButton"></a></div>
  </section>
</main>

<footer>
  <span>© <span id="year"></span> Eva Narváez</span>
  <span data-t="footerText"></span>
</footer>

<script>
const SUPABASE_URL="https://vavevulydesvapopwqgd.supabase.co";
const SUPABASE_KEY="sb_publishable_pqNBiPM-4zQk_-Ile4fnQw_BXvrW0dN";
const EMAIL="kunst@example.com"; /* HIER die echte E-Mail-Adresse eintragen */

const L={
de:{title:"Eva Narváez – Bildende Kunst",navGallery:"Galerie",navAbout:"Über mich",
 eyebrow:"Originalkunst · Mit Liebe geschaffen",heroTitle:"Kunst, die Räume und Herzen berührt.",
 heroText:"Originalwerke von Eva Narváez, voller Farbe und Emotion.",heroButton:"WERKE ENTDECKEN",
 collection:"Die Kollektion",galleryTitle:"Ausgewählte Werke",gallerySubtitle:"Jedes Werk ein Unikat.",
 aboutEyebrow:"Die Künstlerin",aboutTitle:"Kunst mit Persönlichkeit",contactButton:"KONTAKT AUFNEHMEN",
 footerText:"Originalkunst · Mit Liebe geschaffen",available:"Verfügbar",sold:"Verkauft",enquire:"Werk anfragen",
 onRequest:"Preis auf Anfrage",loading:"Kunstwerke werden geladen …",empty:"Noch keine veröffentlichten Kunstwerke vorhanden.",
 error:"Die Kunstwerke konnten nicht geladen werden",subject:"Anfrage zu",
 about:["Ich heiße Eva Narváez und komme aus Cádiz, Spanien. Ich habe Bildende Kunst an der Universität Alonso Cano in Granada studiert, wo ich meine künstlerischen Fähigkeiten weiterentwickelt und meinen eigenen Stil gefunden habe.",
 "Anschließend verbrachte ich ein Jahr in Dublin, wo ich mich mit Sketching beschäftigte und neue Inspirationen und Eindrücke sammeln konnte.",
 "Meine Arbeiten durfte ich bereits bei zwei Vernissagen in Chiclana de la Frontera präsentieren: „Color y Vida“ und „Perfectamente Imperfecta“. Beide Ausstellungen waren für mich eine besondere Gelegenheit, meine Kreativität und meine Leidenschaft für die Kunst mit anderen Menschen zu teilen.",
 "Mit meiner Kunst möchte ich Farben, Emotionen und persönliche Erfahrungen zum Ausdruck bringen und die Betrachter dazu einladen, die Welt aus meiner ganz eigenen Perspektive zu entdecken."]},
es:{title:"Eva Narváez – Bellas Artes",navGallery:"Galería",navAbout:"Sobre mí",
 eyebrow:"Arte original · Creado con amor",heroTitle:"Arte que conmueve espacios y corazones.",
 heroText:"Obras originales de Eva Narváez, llenas de color y emoción.",heroButton:"DESCUBRIR OBRAS",
 collection:"La colección",galleryTitle:"Obras seleccionadas",gallerySubtitle:"Cada obra es única.",
 aboutEyebrow:"La artista",aboutTitle:"Arte con personalidad",contactButton:"CONTACTAR",
 footerText:"Arte original · Creado con amor",available:"Disponible",sold:"Vendida",enquire:"Consultar obra",
 onRequest:"Precio a consultar",loading:"Cargando obras …",empty:"Todavía no hay obras publicadas.",
 error:"No se pudieron cargar las obras",subject:"Consulta sobre",
 about:["Me llamo Eva Narváez y soy de Cádiz, España. Estudié Bellas Artes en la Universidad Alonso Cano de Granada, donde desarrollé mis habilidades artísticas y encontré mi propio estilo.",
 "Después pasé un año en Dublín, donde me dediqué al sketching y pude recoger nuevas inspiraciones e impresiones.",
 "Ya he podido presentar mi trabajo en dos exposiciones en Chiclana de la Frontera: “Color y Vida” y “Perfectamente Imperfecta”. Ambas fueron para mí una ocasión especial para compartir mi creatividad y mi pasión por el arte con otras personas.",
 "Con mi arte quiero expresar colores, emociones y experiencias personales, e invitar a quienes lo contemplan a descubrir el mundo desde mi perspectiva muy personal."]},
en:{title:"Eva Narváez – Fine Art",navGallery:"Gallery",navAbout:"About me",
 eyebrow:"Original art · Made with love",heroTitle:"Art that moves spaces and hearts.",
 heroText:"Original works by Eva Narváez, full of colour and emotion.",heroButton:"EXPLORE THE ART",
 collection:"The collection",galleryTitle:"Selected works",gallerySubtitle:"Every piece is unique.",
 aboutEyebrow:"The artist",aboutTitle:"Art with personality",contactButton:"GET IN TOUCH",
 footerText:"Original art · Made with love",available:"Available",sold:"Sold",enquire:"Enquire about artwork",
 onRequest:"Price on request",loading:"Loading artworks …",empty:"No published artworks yet.",
 error:"The artworks could not be loaded",subject:"Enquiry about",
 about:["My name is Eva Narváez and I come from Cádiz, Spain. I studied Fine Arts at the Universidad Alonso Cano in Granada, where I developed my artistic skills and found my own style.",
 "I then spent a year in Dublin, where I focused on sketching and was able to gather new inspiration and impressions.",
 "I have already had the chance to present my work at two exhibition openings in Chiclana de la Frontera: “Color y Vida” and “Perfectamente Imperfecta”. Both exhibitions were a special opportunity for me to share my creativity and my passion for art with other people.",
 "With my art, I want to express colour, emotion and personal experience, and invite viewers to discover the world from my very own perspective."]}
};

const $=id=>document.getElementById(id);
let lang="de",arts=[],state="loading",err="";

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function imgURL(p){return SUPABASE_URL+"/storage/v1/object/public/artworks/"+encodeURI(p)}
function money(v){return new Intl.NumberFormat({de:"de-DE",es:"es-ES",en:"en-GB"}[lang],{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(v)}
function mail(sub){return "mailto:"+EMAIL+(sub?"?subject="+encodeURIComponent(sub):"")}

function render(){
  const t=L[lang],msg=$("message"),grid=$("artGrid");
  if(state!=="ok"||!arts.length){
    grid.innerHTML="";msg.hidden=false;msg.className=state==="error"?"error":"";
    msg.textContent=state==="loading"?t.loading:state==="error"?t.error+" ("+err+")":t.empty;
    return;
  }
  msg.hidden=true;
  grid.innerHTML=arts.map(a=>{
    const ti=a["title_"+lang]||a.title_de||"",de=a["description_"+lang]||a.description_de||"",sold=a.available===false;
    return '<article class="art-card"><img src="'+esc(imgURL(a.image_path))+'" alt="'+esc(ti)+'" loading="lazy">'+
      '<h3>'+esc(ti)+'</h3>'+(de?'<div class="description">'+esc(de)+'</div>':"")+
      '<div class="price">'+(a.price>0?money(a.price):t.onRequest)+'</div>'+
      '<span class="status">'+(sold?t.sold:t.available)+'</span>'+
      (sold?"":'<a class="button" href="'+mail(t.subject+": "+ti)+'">'+t.enquire+'</a>')+'</article>';
  }).join("");
}

function setLang(l){
  if(!L[l])return;
  lang=l;const t=L[l];
  document.documentElement.lang=l;document.title=t.title;$("language").value=l;
  document.querySelectorAll("[data-t]").forEach(e=>{e.textContent=t[e.dataset.t]});
  $("aboutText").innerHTML=t.about.map(p=>"<p>"+esc(p)+"</p>").join("");
  document.querySelectorAll(".contact-link").forEach(e=>{e.href=mail()});
  try{localStorage.setItem("lang",l)}catch(e){}
  render();
}

async function load(){
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/artworks?select=*&published=eq.true&order=sort.asc,created_at.desc",{headers:{apikey:SUPABASE_KEY}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    arts=await r.json();state="ok";
    
  }catch(e){state="error";err=e.message||String(e);console.warn("Supabase",e)}
  render();
}

const hero=$("heroImg");hero.onload=()=>{hero.hidden=false};hero.src=imgURL("portrait.jpg");
$("language").addEventListener("change",e=>setLang(e.target.value));
$("year").textContent=new Date().getFullYear();
let l0=null;try{l0=localStorage.getItem("lang")}catch(e){}
if(!L[l0]){const n=(navigator.language||"de").slice(0,2);l0=L[n]?n:"de"}
setLang(l0);
load();
</script>
</body>
</html>
