/* ===== Entwurf „Galerie“: ruhige, helle Bühne – die Werke stehen im Mittelpunkt ===== */
:root{--side:#191919;--gold:#c1a377;--goldtext:#8b6a30;--cream:#f6f1dd;--page:#faf8f3;--ink:#2b2a26;--muted:#6a655a;--line:rgba(43,42,38,.12);

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:clamp(48px,7vh,88px) clamp(28px,3.5vw,56px);width:100%;align-items:start}

.field:hover,.field:focus-visible{border-color:var(--goldtext);color:var(--goldtext)}
/* Rubriken und Reihen als Bildkacheln: Titelbild, darunter Name und Anzahl – wie Räume in einer Galerie */

.cover:hover .cv,.cover:focus-visible .cv{transform:none;box-shadow:none}

.cover .cv.ph{display:flex;align-items:center;justify-content:center;aspect-ratio:5/4;height:auto;width:100%;background:#f1ece1;border:0;color:var(--muted);font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:300;text-align:center;padding:12px;transition:background .5s}
.mos{display:none}
.cover:hover .cv.ph,.cover:focus-visible .cv.ph{background:#ebe2cf}
#gCartoon .covers{margin-top:clamp(8px,2vh,20px)}
#gCartoon{row-gap:clamp(16px,2.5vh,28px)}
.cover:hover .cv img,.cover:focus-visible .cv img{transform:scale(1.04)}
.cover .cvt{display:block;margin-top:18px;font-size:15px;letter-spacing:.2em;text-transform:uppercase;font-weight:400;transition:color .3s}
.cover:hover .cvt{color:var(--goldtext)}
.cover .cvn{display:block;margin-top:2px;font-size:12px;letter-spacing:.08em;color:var(--muted)}

.crumbs a{color:var(--goldtext);text-decoration:none}
.note{color:var(--muted);font-size:15px}
.tile h3{margin:18px 0 4px;font-size:15px;font-weight:400;letter-spacing:.08em}

.zoom img{width:100%;height:auto;display:block}

/* sehr hohe Formate (z. B. Enkaustik) passen ganz auf den Bildschirm: höchstens ~3/4 der Höhe, dann schmaler und mittig – nichts wird beschnitten */
.tile .zoom img.ld{max-height:75vh;max-height:75svh;width:auto;max-width:100%;margin-inline:auto}
.more{position:absolute;right:10px;bottom:10px;background:rgba(250,248,243,.92);color:var(--ink);font-size:11px;letter-spacing:.1em;padding:3px 8px}
.mail{display:inline-block;margin-top:14px;padding:12px 26px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;text-transform:uppercase;font-size:12.5px;letter-spacing:.2em;transition:background .25s,color .25s}
.mail:hover{background:var(--ink);color:var(--page)}

.tile.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.tile{opacity:1;transform:none;transition:none}}

/* Schwebender Knopf „Nach oben“: goldene Pille mit Text, der Kreis um den Winkel zeigt, wie weit man gescrollt hat.
   Erscheint die Fußzeile, verschwindet er – dort steht dann der Link „Nach oben“. */
#toTop{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;
 display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 5px 0 15px;border:0;border-radius:999px;cursor:pointer;
 /* durchscheinend mit goldener Kontur und Schrift – verdeckt kaum etwas */
 background:rgba(250,248,243,.32);color:var(--goldtext);font:400 11px/1 var(--font);letter-spacing:.18em;text-transform:uppercase;
 -webkit-backdrop-filter:blur(10px) saturate(1.4);backdrop-filter:blur(10px) saturate(1.4);
 box-shadow:inset 0 0 0 1px rgba(193,163,119,.75);opacity:0;transform:translateY(12px);pointer-events:none;
 transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),background .2s}
#toTop.on{opacity:1;transform:none;pointer-events:auto}
#toTop:hover{background:var(--gold);color:#fff;box-shadow:inset 0 0 0 1px var(--gold)}
#toTop:active{transform:scale(.96)}
#toTop .kreis{display:grid;place-items:center;width:28px;height:28px}
#toTop .kreis svg{grid-area:1/1}
#toTop .ring{width:28px;height:28px;transform:rotate(-90deg)}
#toTop .ring circle{fill:none;stroke-width:1.4}
#toTop .ring .spur{stroke:currentColor;opacity:.25}
#toTop .ring .stand{stroke:currentColor;stroke-linecap:round}
#toTop .ic{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#toTop:hover .ic{transform:translateY(-2px)}
.nw{white-space:nowrap}
.hoch-link{display:inline-flex;align-items:center;gap:6px;padding:0;border:0;background:none;color:var(--goldtext);cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit}
.hoch-link svg{width:16px;height:16px;padding:2px;border:1px solid currentColor;border-radius:50%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.hoch-link:hover svg{transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){#toTop,#toTop .ic,.hoch-link svg{transition:none}}
footer{margin-top:auto;border-top:1px solid var(--line);color:var(--muted);font-size:12px;letter-spacing:.05em;text-align:center;padding:26px var(--edge);overflow-wrap:anywhere}

/* schlanke Fußzeile: Symbole mit kurzem Wort, darunter eine feine Zeile mit Rechtlichem und © */
.fuss-links{display:flex;justify-content:center;gap:clamp(26px,5vw,44px)}
.fuss-links a{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;transition:color .25s}

:focus-visible{outline:2px solid var(--goldtext);outline-offset:3px}

/* Bildschutz: kein Markieren, kein Ziehen, kein „Bild sichern“-Menü per Langdruck (iPhone) */
img,.zoom,.lb-pic{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none}

/* Großansicht */
dialog{border:0;padding:0;background:transparent;width:100%;height:100%;max-width:100vw;max-height:100vh}
dialog::backdrop{background:var(--page)}
.lb-in{position:relative;height:100%;display:flex;align-items:center;justify-content:center;gap:120px;padding:56px 90px 24px}
.lb-pic{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0;max-width:calc(100% - 400px)}

#lbDesc{color:var(--muted);font-size:14.5px;line-height:1.65;margin-top:8px}
/* Touch: Bilder liegen als Band nebeneinander, das Handy scrollt nativ mit Schwung und rastet ein */
#lbBand{display:none}
#lb.band #lbImg{display:none}
#lb.band #lbBand{display:flex;width:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}

#lbBand .sl{flex:0 0 100%;height:100%;display:flex;flex-direction:column;align-items:center;scroll-snap-align:center;scroll-snap-stop:always;contain:layout paint}   /* jede Folie für sich zeichnen: ruhigeres Wischen */
#lbBand .sl-bild{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#lbBand img{max-width:calc(100% - 16px);max-height:100%;object-fit:contain}
/* Titel und Angaben gehören fest zum Bild und wischen mit – nichts zieht nach */
#lbBand .sl-text{flex:none;height:92px;width:100%;box-sizing:border-box;padding:14px 56px 0;text-align:center;overflow:hidden}
#lbBand .sl-cap{color:var(--ink);font-size:15px;letter-spacing:.06em;line-height:1.35}

const $=id=>document.getElementById(id);
let lang="de",arts=[],state="loading",err="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const imgURL=p=>SB_URL+"/storage/v1/object/public/artworks/"+encodeURI(p);
/* verkleinerte Fassung (Supabase-Bilddienst) statt des Originals: in der Übersicht reichen ~900 px statt 400–900 KB großer Originale.
   Klappt der Dienst einmal nicht, lädt das Bild ohne Zutun das Original (onerror). */
const imgW=(p,w)=>SB_URL+"/storage/v1/render/image/public/artworks/"+encodeURI(p)+"?width="+w+"&height="+(w*3)+"&resize=contain&quality=80";
const imgAttr=(p,w)=>'src="'+esc(imgW(p,w))+'" onerror="this.onerror=null;this.src=\''+esc(imgURL(p))+'\'"';

/* Werkangaben: Technik · Format · Jahr (leere Felder entfallen) */
const meta=a=>[a["technique_"+lang]||a.technique_de,a.size,a.year].filter(Boolean).join(" · ");
function card(a,i){
  const ti=a["title_"+lang]||a.title_de||"",n=(a.detail_paths||[]).length;
  return '<article class="tile"><button type="button" class="zoom" data-i="'+i+'" aria-label="'+esc(ti)+'"><img '+imgAttr(a.image_path,900)+' alt="'+esc(ti)+'" loading="lazy" decoding="async" onload="this.classList.add(\'ld\')">'+(n?'<span class="more">+'+n+'</span>':"")+'</button>'+
   '<h3>'+esc(ti)+'</h3>'+(meta(a)?'<p class="meta">'+esc(meta(a))+'</p>':"")+'</article>';
}
function renderFav(){
  const box=$("fav");let i=arts.findIndex(a=>a.featured===true);
  if(i<0)i=arts.findIndex(a=>(a.category||"kunst")==="kunst");
  if(state!=="ok"||i<0){box.hidden=true;box.innerHTML="";return}
  const a=arts[i],ti=a["title_"+lang]||a.title_de||"";
  box.hidden=false;
  box.innerHTML='<button type="button" class="zoom" data-i="'+i+'" aria-label="'+esc(ti)+'"><img '+imgAttr(a.image_path,1600)+' alt="'+esc(ti)+'"></button><p class="favcap">'+esc(ti)+'</p>';
}
/* Bildende Kunst nach Technik gliedern (Spalte medium); auf dem Handy aufklappbar */
const AUSWAHL=4,openC=new Set();
const MED={aquarell:"mAq",acryl:"mAc",collage:"mCo",enkaustik:"mEn"},CT={cartoon:"ctC",illustration:"ctI"},openG=new Set();
const cards=l=>l.map(([a,i])=>card(a,i)).join("");
/* Am Ende eines Bereichs: leise Einladung zu Instagram – nur ein Link, kein eingebetteter Feed (keine Daten an Meta) */
const igEinl=key=>{const a=CFG.insta.find(x=>x.key===key);if(!a)return"";const h=a.handle.replace(/^@/,"");
  return '<p class="ig-einladung"><span>'+esc(L[lang].tIg)+'</span><a href="https://instagram.com/'+h+'" target="_blank" rel="noopener">@'+esc(h)+' →</a></p>'};
function renderGallery(){
  renderFav();
  const t=L[lang],box=$("gKunst");
  const list=arts.map((a,i)=>[a,i]).filter(([a])=>(a.category||"kunst")==="kunst");
  box.innerHTML=state!=="ok"?'<p class="note">'+(state==="loading"?t.loading:t.error+" ("+esc(err)+")")+'</p>'
    :!list.length?'<p class="note">'+t.empty+'</p>'
    :list.some(([a])=>MED[a.medium])
      ?[...Object.keys(MED),""].map(m=>{const g=list.filter(([a])=>(MED[a.medium]?a.medium:"")===m),o=openG.has(m),mehr=g.length>AUSWAHL;
        if(!g.length)return"";
        const kacheln=g.map(([a,i],k)=>{const c=card(a,i);return k<AUSWAHL?c:c.replace('class="tile"','class="tile extra"')}).join("");
        return '<h2 class="sub"><span class="acc">'+esc(t[m?MED[m]:"mMore"])+'<span class="cnt">'+g.length+'</span></span></h2><div class="tiles grp'+(o?" alle":"")+'" id="grp-'+(m||"mehr")+'">'+kacheln+
          (mehr?'<button type="button" class="alle-btn" data-m="'+m+'" aria-expanded="'+o+'" aria-controls="grp-'+(m||"mehr")+'">'+esc(o?t.tWeniger:t.tAlle+" ("+g.length+")")+'</button>':"")+'</div>'}).join("")
      :cards(list);
  if(state==="ok"&&list.length)box.insertAdjacentHTML("beforeend",igEinl("nKunst"));
  renderCartoon();
}

let sub=[];

const WORKS={de:["Werk","Werke"],es:["obra","obras"],en:["work","works"]};
function cover(list,href,label,lead=list[0]){
  const n=list.length,w=WORKS[lang]||WORKS.de;lead=list.find(x=>x[0].image_path)||lead;const a=lead&&lead[0];
  const pic=a&&a.image_path?'<img '+imgAttr(a.image_path,900)+' alt="" loading="lazy" decoding="async" onload="this.classList.add(\'ld\')">':"";
  // Bilderbogen: aus jeder Serie ein Bild (zeigt die Vielfalt), dann Einzelwerke – höchstens vier
  const mitBild=list.filter(x=>x[0].image_path),serien=new Set(),vorn=[],rest=[];
  mitBild.forEach(x=>{const sr=x[0].series;if(sr&&!serien.has(sr)){serien.add(sr);vorn.push(x)}else rest.push(x)});
  const mos=vorn.concat(rest).slice(0,4).map(x=>'<img '+imgAttr(x[0].image_path,400)+' alt="" loading="lazy" decoding="async">').join("");
  const top=(pic?'<span class="cv">'+pic+'</span>':'<span class="cv ph"><span>'+esc(L[lang].tSoon)+'</span></span>')+'<span class="mos">'+mos+'</span><span class="cvt">'+esc(label)+'</span>';
  return '<a class="cover" href="'+href+'">'+top+'<span class="cvn">'+(n?'':esc(L[lang].tSoon))+'</span></a>';   // keine Werkzahl, nur „In Arbeit“, solange ein Bereich leer ist
}
function renderCartoon(){
  const t=L[lang],box=$("gCartoon"),empty='<p class="note">'+t.empty+'</p>';
  if(state!=="ok"){box.innerHTML='<p class="note">'+(state==="loading"?t.loading:t.error+" ("+esc(err)+")")+'</p>';return}
  const [type,ser]=sub;
  const ofType=k=>arts.map((a,i)=>[a,i]).filter(([a])=>a.category==="cartoon"&&(CT[a.cartoon_type]?a.cartoon_type:"cartoon")===k);
  if(!CT[type]){$("cartoon").querySelector("h1").textContent=t.hCartoon;box.innerHTML='<div class="covers">'+Object.keys(CT).map(k=>cover(ofType(k),"#cartoon/"+k,t[CT[k]],null)).join("")+'</div>';return}
  const inType=ofType(type);
  // Varianten: Cartoon und Illustration sind eigene Menüpunkte – die Überschrift heißt dann genau so, der Pfad beginnt beim Bereich
  const getrennt=!!document.documentElement.dataset.var,h1=$("cartoon").querySelector("h1");
  h1.textContent=getrennt?t[CT[type]]:t.hCartoon;
  const crumbs=getrennt?(ser?'<p class="crumbs"><a href="#cartoon/'+type+'">'+esc(t[CT[type]])+'</a> › '+esc(ser)+'</p>':''):
   '<p class="crumbs"><a href="#cartoon">'+esc(t.hCartoon)+'</a> › '+(ser?'<a href="#cartoon/'+type+'">'+esc(t[CT[type]])+'</a> › '+esc(ser):esc(t[CT[type]]))+'</p>';
  // Sprungzeile: jede Reihe öffnet sich für sich; in einer Reihe ist die aktuelle markiert
  const reihen=[...new Set(inType.map(([a])=>a.series).filter(Boolean))].sort((x,y)=>x.localeCompare(y));
  const sprungC=akt=>reihen.length>1?'<nav class="sprung" aria-label="'+esc(t[CT[type]])+'">'+reihen.map(n=>'<a href="#cartoon/'+type+'/'+encodeURIComponent(n)+'"'+(n===akt?' aria-current="page"':'')+'>'+esc(n)+'</a>').join('<span aria-hidden="true">·</span>')+'</nav>':'';
  if(ser&&document.documentElement.dataset.var==="c"){const g=inType.filter(([a])=>a.series===ser),zur='<a href="#cartoon/'+type+'">'+esc(t.tZurueck)+'</a>';
    box.innerHTML=sprungC(ser)+'<h2 class="kapitel"><span>'+esc(ser)+'</span>'+zur+'</h2>'+(g.length?cards(g):empty)+(g.length>AUSWAHL?'<p class="alle">'+zur+'</p>':'')+(g.length?igEinl("nCartoon"):'');return}
  if(ser){const g=inType.filter(([a])=>a.series===ser);box.innerHTML=crumbs+(g.length?cards(g):empty);return}
  if(document.documentElement.dataset.var==="c"){   // Werke direkt zeigen, Serien als Kapitel – keine Zwischenseite „Serie · 4 Werke“
    const ser2=[...new Set(inType.map(([a])=>a.series).filter(Boolean))].sort((x,y)=>x.localeCompare(y)),einzeln=inType.filter(([a])=>!a.series);
    const gruppen=ser2.map(n=>[n,inType.filter(([a])=>a.series===n)]);
    if(einzeln.length)gruppen.push([ser2.length?t.tEinzel:"",einzeln]);
    // pro Kapitel zuerst eine Auswahl (Reihenfolge aus dem Admin), der Rest klappt an Ort und Stelle auf
    const kap=([n,l],k)=>{const offen=openC.has(type+"|"+n),mehr=l.length>AUSWAHL;
      if(!n)return cards(l);
      // „Alle ansehen“ öffnet die Reihe für sich – dort kommt danach keine andere Reihe mehr
      return '<h2 class="kapitel" id="kap'+k+'"><span>'+esc(n)+'</span>'+(mehr?'<a href="#cartoon/'+type+'/'+encodeURIComponent(n)+'">'+esc(t.tAlle)+'</a>':'')+'</h2>'+cards(l.slice(0,AUSWAHL))};
    const sprung=sprungC(null);
    box.innerHTML=sprung+gruppen.map(kap).join("")+(inType.length?igEinl("nCartoon"):'<p class="note ruhig">'+esc(t.tSoon)+'</p>');
    box.querySelectorAll(".rest .tile").forEach(x=>x.classList.add("in"));
    return}
  const series=[...new Set(inType.map(([a])=>a.series).filter(Boolean))].sort((x,y)=>x.localeCompare(y)),loose=inType.filter(([a])=>!a.series);
  box.innerHTML=crumbs+(series.length?'<div class="covers">'+series.map(n=>cover(inType.filter(([a])=>a.series===n),"#cartoon/"+type+"/"+encodeURIComponent(n),n)).join("")+'</div>':"")+cards(loose)+(series.length||loose.length?"":empty);
}

/* Eingangstüren und echte Adressen: /kunst, /breva usw. statt #kunst. Jede Tür ist eine Kopie dieser Seite (kunst.html usw.,
   erzeugt von tools/tueren.py) mit eigenem Titel für Suchmaschinen; window.TUER.h sagt dort, was aufgeschlagen wird.
   Beim Klicken schreibt die Seite dieselben Adressen in die Adresszeile (ohne neu zu laden) – wer sie teilt, teilt die Tür. */
const kurzname=t=>String(t||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const TUEREN={kunst:["kunst","Bildende Kunst"],cartoon:["cartoon/cartoon","Cartoon"],illustration:["cartoon/illustration","Illustration"],"ueber-mich":["ueber","Über mich"],kontakt:["kontakt","Kontakt"],bildrechte:["bildrechte","Bildrechte"]};
const TYP_WORT={cartoon:"Cartoons",illustration:"Illustrationen"};
/* Tab-Titel der Türen in allen drei Sprachen (Namen aus L) */
const TUER_NAME={kunst:"nKunst",cartoon:"tCartoon",illustration:"tIllu","ueber-mich":"nUeber",kontakt:"nKontakt",bildrechte:"nRights"};
const REIHE_WORT={de:{cartoon:"Cartoons von",illustration:"Illustrationen von"},es:{cartoon:"Cartoons de",illustration:"Ilustraciones de"},en:{cartoon:"Cartoons by",illustration:"Illustrations by"}};
let letzteId=null;
/* Adressen je Sprache: Deutsch ohne Zusatz (/kunst), Spanisch unter /es/ (/es/bellas-artes), Englisch unter /en/ (/en/fine-art).
   Reihen (z. B. Breva) heißen in allen Sprachen gleich. Muss zu SLUGS in tools/tueren.py passen. */
const SLUGS={es:{kunst:"bellas-artes",cartoon:"cartoon",illustration:"ilustracion","ueber-mich":"sobre-mi",kontakt:"contacto",bildrechte:"derechos-de-imagen"},
             en:{kunst:"fine-art",cartoon:"cartoon",illustration:"illustration","ueber-mich":"about",kontakt:"contact",bildrechte:"image-rights"}};
const sprachVorsatz=l=>l==="de"?"":"/"+l;
const slugIn=(l,k)=>l==="de"?k:SLUGS[l][k];
const pfadSprache=()=>{const m=location.pathname.match(/^\/(es|en)(\/|\.html$|$)/);return m?m[1]:"de"};
const TUER_START=window.TUER||null,TUER_START_PFAD=location.pathname;let TUER=TUER_START;
const tuerH=()=>location.hash.slice(1)||(TUER?TUER.h:"");
function tuerAusPfad(){   // welche Tür passt zur Adresse (ohne #)?
  if(location.hash)return null;
  const l=pfadSprache();
  let sl=decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g,"").replace(/\.html$/,"");
  if(l!=="de")sl=sl.replace(/^(es|en)(\/|$)/,"");
  if(!sl||sl==="index")return null;
  const k=Object.keys(TUEREN).find(k=>slugIn(l,k)===sl);
  if(k)return{h:TUEREN[k][0]};
  const w=arts.find(a=>a.category==="cartoon"&&a.series&&kurzname(a.series)===sl);
  if(w)return{h:"cartoon/"+(CT[w.cartoon_type]?w.cartoon_type:"cartoon")+"/"+w.series};
  return location.pathname===TUER_START_PFAD?TUER_START:null;
}
function tuerPruefen(){   // nach Klick (#…) oder Zurück-Geste: was gilt jetzt?
  if(location.hash){TUER=null;const start=sprachVorsatz(lang)+"/";if(location.pathname!==start){try{history.replaceState(null,"",start+location.search+location.hash)}catch(e){}}}
  else{TUER=tuerAusPfad();const pl=pfadSprache();if(pl!==lang)setLang(pl)}   // Zurück-Geste in eine andere Sprache
}
/* nach jedem Seitenwechsel: schöne Adresse (ohne neuen Verlaufseintrag) und passender Titel */
function pfadSync(id){
  let sl=null,titel=null;
  if(id==="home"){sl=""}
  else if(id==="cartoon"&&!CT[sub[0]]){}   // Übersicht „Cartoon & Illustration“ (am Mac) hat keine eigene Tür: bleibt /#cartoon
  else if(id==="cartoon"){const typ=sub[0];
    if(sub[1]){sl=kurzname(sub[1]);titel=sub[1]+" – "+REIHE_WORT[lang][typ]+" Eva Narváez"}
    else sl=typ}
  else{const k=Object.keys(TUEREN).find(k=>TUEREN[k][0]===id);if(k)sl=k}
  if(typeof sl==="string"){
    const ziel=sprachVorsatz(lang)+"/"+(sl&&TUEREN[sl]?slugIn(lang,sl):sl);
    if(ziel!==location.pathname||location.hash){try{history.replaceState(null,"",ziel+location.search)}catch(e){}}
    TUER=sl?{h:id==="cartoon"?"cartoon/"+sub[0]+(sub[1]?"/"+sub[1]:""):TUEREN[sl][0]}:null;
    if(!titel&&sl)titel=L[lang][TUER_NAME[sl]]+" – Eva Narváez";
  }
  letzteId=id;
  document.title=TUER&&titel?titel:L[lang].pageTitle;
}

const lb={a:null,i:0,list:[],pos:0};

/* Weiter/Zurück: erst durch die Detailfotos eines Werks, dann zum nächsten Werk derselben Gruppe (Reihe bzw. Bereich) */
function step(d){
  if(lbBandAn){const n=flach.length,v=ziel>=0?ziel:cur;if(n>1)bandGehe(((v+d)%n+n)%n,v+d>=0&&v+d<n);return}
  const n=photos(lb.a).length;
  if(lb.i+d>=0&&lb.i+d<n){lb.i+=d;showLB();return}
  if(lb.list.length<2){lb.i=(lb.i+d+n)%n;showLB();return}
  lb.pos=(lb.pos+d+lb.list.length)%lb.list.length;lb.a=arts[lb.list[lb.pos]];lb.i=d<0?photos(lb.a).length-1:0;showLB()}
function lbGruppe(b){

  return l}

  lbBandAn=matchMedia("(pointer:coarse)").matches;$("lb").classList.toggle("band",lbBandAn);lb._tA=null;
  if(lbBandAn){bandBauen();$("lb").showModal();const j=flach.findIndex(f=>f[1]===lb.pos&&f[2]===0);cur=j;bandLaden(j);bandGehe(j,false);showLB(true)}

  $("lb").classList.toggle("mitDetails",flach.some(f=>f[2]>0));
  const N=lb.list.length;
  band.innerHTML=flach.map((f,j)=>{const a=arts[f[0]],ti=a["title_"+lang]||a.title_de||"",n=photos(a).length,de=a["description_"+lang]||a.description_de||"";
    const nr=N>1?"  ·  "+(f[1]+1)+" / "+N:n>1?"  ·  "+(f[2]+1)+" / "+n:"";
    return '<div class="sl"><div class="sl-bild"><img data-j="'+j+'" alt="'+esc(ti)+'" draggable="false"></div><div class="sl-text"><div class="sl-cap">'+esc(ti+nr)+'</div>'+(meta(a)?'<div class="sl-meta">'+esc(meta(a))+'</div>':'')+(de?'<div class="sl-desc">'+esc(de)+'</div>':'')+'</div></div>'}).join("")}
function bandLaden(j){for(const x of [j,j+1,j-1,j+2,j+3,j-2]){const f=flach[x],im=f&&band.children[x].querySelector("img");if(im&&!im.getAttribute("src")){im.decoding="async";im.onerror=()=>{im.onerror=null;im.src=imgURL(f[3])};im.src=imgW(f[3],1200);if(im.decode)im.decode().catch(()=>{})}}}   // vorab entschlüsseln: kein Ruckeln, wenn das Bild ins Bild gleitet
/* Zum Bild j: ohne Animation (Öffnen) oder weich (Pfeile). Das weiche Gleiten macht die Seite selbst: scrollTo(smooth) bleibt in
   Safari/Chrome am Handy an der Einrast-Funktion (scroll-snap) hängen – die Pfeile taten dann nichts. Während der Animation ist das
   Einrasten kurz aus, danach wieder an. */
let gleit=0;
function bandGehe(j,weich){bandLaden(j);ziel=weich?j:-1;const zielX=j*band.clientWidth;cancelAnimationFrame(gleit);
  if(!weich||matchMedia("(prefers-reduced-motion: reduce)").matches){band.style.scrollSnapType="";band.scrollTo({left:zielX,behavior:"instant"});if(weich)bandSteht();return}
  const vonX=band.scrollLeft,weg=zielX-vonX,dauer=Math.min(480,260+Math.abs(weg)/band.clientWidth*90),t0=performance.now();
  band.style.scrollSnapType="none";
  const schritt=t=>{const x=Math.min(1,(t-t0)/dauer),e=1-Math.pow(1-x,3);band.scrollLeft=vonX+weg*e;
    if(x<1)gleit=requestAnimationFrame(schritt);else{band.scrollLeft=zielX;band.style.scrollSnapType="";bandSteht()}};
  gleit=requestAnimationFrame(schritt)}
/* Wischen bricht eine laufende Pfeil-Animation ab, damit sich nichts in die Quere kommt */
band.addEventListener("touchstart",()=>{if(band.style.scrollSnapType==="none"){cancelAnimationFrame(gleit);band.style.scrollSnapType=""}},{passive:true});
/* Während des Wischens nichts am Layout ändern (Safari rastet sonst aufs alte Bild zurück) – Titel erst tauschen, wenn das Band steht */
let ruhe=0;
function bandSteht(){clearTimeout(ruhe);const w=band.clientWidth;if(!w||!flach.length)return;const j=Math.round(band.scrollLeft/w);if(j===ziel)ziel=-1;if(j===cur||!flach[j])return;
  cur=j;const f=flach[j];lb.a=arts[f[0]];lb.pos=f[1];lb.i=f[2];bandLaden(j);showLB(true)}
band.addEventListener("scroll",()=>{clearTimeout(ruhe);ruhe=setTimeout(bandSteht,120)},{passive:true});   // während des Wischens: nichts tun
band.addEventListener("scrollend",bandSteht);
$("lb").addEventListener("close",()=>{if(lbBandAn&&!$("lb").open){band.innerHTML="";flach=[];cur=-1}});

$("lbX").onclick=()=>$("lb").close();
$("lbPrev").onclick=()=>step(-1);$("lbNext").onclick=()=>step(1);
$("lbThumbs").addEventListener("click",e=>{const k=e.target.dataset.k;if(k!==undefined){lb.i=+k;showLB()}});
$("lb").addEventListener("click",e=>{if(e.target.id==="lb"||e.target.classList.contains("lb-in"))$("lb").close()});
$("lb").addEventListener("keydown",e=>{if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)});

document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
const pt=$("portrait");pt.onload=()=>{pt.hidden=false};pt.onerror=()=>{pt.onerror=null;pt.src=imgURL("portrait.jpg")};pt.src=imgW("portrait.jpg",900);

async function load(){
  try{
    const r=await fetch(SB_URL+"/rest/v1/artworks?select=*&published=eq.true&order=sort.asc,created_at.desc",{headers:{apikey:SB_KEY}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    arts=await r.json();state="ok";
    const illu=document.querySelector('nav a[data-sub="illustration"]');if(illu)illu.hidden=!arts.some(a=>a.category==="cartoon"&&a.cartoon_type==="illustration");
  }catch(e){state="error";err=e.message||String(e);console.warn("Supabase",e)}
  renderGallery();
}

try{localStorage.removeItem("lang")}catch(e){}   // alte gespeicherte Sprachwahl aufräumen: die Sprache steht jetzt in der Adresse
setLang(pfadSprache());   // die Adresse bestimmt die Sprache (/es/…, /en/…, sonst Deutsch) – keine automatische Umleitung
go(tuerH());
load();
/* Bildschutz: Rechtsklick und Ziehen auf Bildern sperren. Bildschirmfotos lassen sich technisch nicht verhindern. */
document.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest("img,.zoom,.lb-pic,#lbThumbs"))e.preventDefault()});
document.addEventListener("dragstart",e=>{if(e.target.tagName==="IMG")e.preventDefault()});
/* Höhe der Infozeile merken, damit die stehende Menüspalte nicht dahinter verschwindet */
(()=>{const f=$("foot");if(!f||!window.ResizeObserver)return;new ResizeObserver(()=>document.documentElement.style.setProperty("--foot",f.offsetHeight+"px")).observe(f)})();
/* Werke beim Hineinscrollen sanft einblenden */
(()=>{const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px"}):null;
 const scan=()=>document.querySelectorAll(".tile:not(.in)").forEach(t=>io?io.observe(t):t.classList.add("in"));
 new MutationObserver(scan).observe(document.querySelector("main"),{childList:true,subtree:true});scan()})();
</script>
